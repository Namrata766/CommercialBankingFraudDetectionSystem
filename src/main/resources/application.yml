
spring.application.name: CommercialBankingFraudDetectionSystem
spring.ai.openai.api-key: ${OPEN_AI_API_KEY}
spring.data.mongodb.uri: mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@cluster0.y1fdo27.mongodb.net/fraud_detection_db?retryWrites=true&w=majority
app.db.seed-data: true
